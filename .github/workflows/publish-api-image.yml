name: Publish API image

# Pushes the API (Dockerfile target "api") to GHCR on main. mosaik-ui's CI runs it for its e2e
# tests with E2E_TESTING=true, MIGRATE_ON_START=true and MAIL_TRANSPORT=json.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Build & push API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          target: api
          push: true
          tags: |
            ghcr.io/peterlaudel/mosaik-api:main
            ghcr.io/peterlaudel/mosaik-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
